name: Проверка курса

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Действия зафиксированы по SHA, а не по плавающему тегу: тег можно
      # переписать, коммит — нет.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Зависимостей нет намеренно: валидатор и тесты работают на голом
      # Python, поэтому проверка не может сломаться из-за сети или
      # недоступного пакета.
      - name: Проверка целостности курса
        run: python3 tools/validate_course.py

      - name: Тесты инструментов
        run: |
          python tests/test_tools.py
          make test

      # Отдельный шаг: проверка обязана уметь падать. Копия репозитория
      # ломается так же, как был сломан сам курс (оборванная вставка
      # цитаты), и валидатор должен это заметить.
      - name: Самопроверка валидатора (проверка должна уметь падать)
        run: bash .github/scripts/selftest.sh
